name = "activity-wheel-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://mattcinnamon.github.io"
RATE_LIMIT_MAX = 10
RATE_LIMIT_WINDOW_HOURS = 1

# KV namespace for rate limiting
# Create with: npx wrangler kv:namespace create RATE_LIMITER
# Then paste the id below
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "YOUR_KV_NAMESPACE_ID"
